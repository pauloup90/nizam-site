<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nizam · إعلان</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=IBM+Plex+Sans:wght@500;600;700&display=swap">
<style>
  :root { --bg: #050505; --panel: #141414; --line: #262626; --fg: #ededed; --muted: #9a9a9a; --warm: #ede6e6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: "IBM Plex Sans Arabic", "IBM Plex Sans", system-ui, sans-serif; }
  .app { min-height: 100%; display: grid; grid-template-rows: auto 1fr auto; gap: 14px; padding: 16px max(16px, env(safe-area-inset-left)); }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
  .seg { display: inline-flex; background: var(--panel); border-radius: 999px; padding: 4px; gap: 4px; }
  button { font: 600 14px inherit; font-family: inherit; border: 0; cursor: pointer; border-radius: 999px; height: 40px; padding-inline: 16px; background: transparent; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--warm); color: #000; }
  .main { background: var(--warm); color: #000; }
  .rec { background: #e11900; color: #fff; }
  .rec[disabled] { opacity: .6; cursor: default; }
  .stage { display: grid; place-items: center; min-height: 0; }
  canvas { max-width: 100%; max-height: calc(100vh - 150px); border-radius: 14px; box-shadow: 0 0 0 1px var(--line); background: #000; }
  .progress { height: 4px; background: var(--panel); border-radius: 999px; overflow: hidden; max-width: 900px; width: 100%; margin-inline: auto; }
  .progress i { display: block; height: 100%; width: 0; background: var(--warm); transform-origin: right; }
  .note { text-align: center; color: var(--muted); font-size: 13px; }
  :focus-visible { outline: 2px solid #6fd8a3; outline-offset: 2px; }
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <div class="seg" role="group" aria-label="مقاس الفيديو">
      <button type="button" data-f="v" aria-pressed="true">طولي 9:16</button>
      <button type="button" data-f="h" aria-pressed="false">عرضي 16:9</button>
      <button type="button" data-f="s" aria-pressed="false">مربع 1:1</button>
    </div>
    <button type="button" class="main" id="play">تشغيل من الأول</button>
    <button type="button" class="rec" id="rec">نزّل الفيديو</button>
  </div>
  <div class="stage"><canvas id="out" aria-label="إعلان تطبيق نظام"></canvas></div>
  <div>
    <div class="progress"><i id="prog"></i></div>
    <p class="note" id="note">الإعلان 30 ثانية. "نزّل الفيديو" بيسجّله من أوله لآخره وبيحفظه على جهازك.</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';
  var T = 30;                       // seconds
  var FORMATS = { v: [1080, 1920], h: [1920, 1080], s: [1080, 1080] };
  var fmt = 'v';
  var W, H;
  var out = document.getElementById('out');
  var ctx = out.getContext('2d');

  // ---- easing helpers -------------------------------------------------------
  function clamp(x, a, b) { return Math.min(b, Math.max(a, x)); }
  function seg(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }
  function eOut(x) { return 1 - Math.pow(1 - x, 3); }
  function eInOut(x) { return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function eBack(x) { var c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }
  function lerp(a, b, x) { return a + (b - a) * x; }
  // visible from a to b with fade length f
  function vis(t, a, b, f) { f = f || .4; return Math.min(seg(t, a, a + f), 1 - seg(t, b - f, b)); }

  // ---- 3D ------------------------------------------------------------------
  var glCanvas = document.createElement('canvas');
  var renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.setClearColor(0x000000, 0);
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(35, 9 / 16, 0.1, 100);
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  var key = new THREE.DirectionalLight(0xffffff, 1.1); key.position.set(3, 4, 6); scene.add(key);
  var rim = new THREE.DirectionalLight(0xffffff, 0.8); rim.position.set(-4, 2, -3); scene.add(rim);

  var PW = 1, PH = 1688 / 780;
  function rounded(w, h, r) {
    var s = new THREE.Shape(), x = -w / 2, y = -h / 2;
    s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
    s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
    s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
    return s;
  }
  function uvFit(geo) {
    geo.computeBoundingBox();
    var b = geo.boundingBox, pos = geo.attributes.position, uv = geo.attributes.uv;
    for (var i = 0; i < pos.count; i++) {
      uv.setXY(i, (pos.getX(i) - b.min.x) / (b.max.x - b.min.x), (pos.getY(i) - b.min.y) / (b.max.y - b.min.y));
    }
    uv.needsUpdate = true;
  }
  var bodyGeo = new THREE.ExtrudeGeometry(rounded(PW + .08, PH + .08, .17), { depth: .09, bevelEnabled: true, bevelThickness: .025, bevelSize: .025, bevelSegments: 4, curveSegments: 12 });
  bodyGeo.center();
  var bodyMat = new THREE.MeshStandardMaterial({ color: 0x151515, metalness: .7, roughness: .3 });
  var screenGeo = new THREE.ShapeGeometry(rounded(PW, PH, .12), 12); uvFit(screenGeo);

  var loader = new THREE.TextureLoader();
  var tex = {};
  function load(name) {
    return new Promise(function (res) {
      loader.load('img/' + name + '.png', function (t) { t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; tex[name] = t; res(); }, undefined, function () { res(); });
    });
  }
  function makePhone() {
    var g = new THREE.Group();
    g.add(new THREE.Mesh(bodyGeo, bodyMat));
    var layers = [];
    for (var i = 0; i < 2; i++) {
      var m = new THREE.Mesh(screenGeo, new THREE.MeshBasicMaterial({ transparent: true, toneMapped: false }));
      m.position.z = .075 + i * .001;
      g.add(m); layers.push(m);
    }
    g.userData.layers = layers;
    scene.add(g);
    return g;
  }
  function setScreen(p, a, b, mix) {
    var L = p.userData.layers;
    if (L[0].material.map !== tex[a]) { L[0].material.map = tex[a] || null; L[0].material.needsUpdate = true; }
    var bt = tex[b || a];
    if (L[1].material.map !== bt) { L[1].material.map = bt || null; L[1].material.needsUpdate = true; }
    L[0].material.opacity = 1;
    L[1].material.opacity = b ? mix : 0;
  }
  function place(p, x, y, z, ry, rx, s) {
    p.position.set(x, y, z); p.rotation.set(rx || 0, ry || 0, 0);
    var k = s === undefined ? 1 : s; p.scale.set(k, k, k); p.visible = k > .001;
  }
  var hero = makePhone(), fan = [makePhone(), makePhone(), makePhone()];

  // ---- layout per format ---------------------------------------------------
  function layout() {
    if (fmt === 'h') return { camZ: 7.2, heroX: -1.9, heroY: 0, textX: .70, textY: .40, spread: 1.55, fanY: -.15, size: 1 };
    if (fmt === 's') return { camZ: 8.6, heroX: 0, heroY: -.55, textX: .5, textY: .16, spread: 1.3, fanY: -.6, size: .78 };
    return { camZ: 7.3, heroX: 0, heroY: -.5, textX: .5, textY: .15, spread: .95, fanY: -.5, size: 1 };
  }

  // ---- 2D overlay helpers --------------------------------------------------
  var markPath = new Path2D('M0 1000V0H500A214 214 0 0 1 714 214V727H573V214A73 73 0 0 0 500 141H141V1000Z');
  function drawMark(cx, cy, size, apart, alpha, rot) {
    ctx.save();
    ctx.globalAlpha = alpha; ctx.fillStyle = '#fff';
    var s = size / 1000, d = apart * size;
    ctx.translate(cx, cy); ctx.rotate(rot || 0);
    // half A
    ctx.save(); ctx.translate(-d, -d); ctx.scale(s, s); ctx.translate(-500, -500); ctx.fill(markPath); ctx.restore();
    // half B (rotated 180)
    ctx.save(); ctx.translate(d, d); ctx.scale(s, s); ctx.rotate(Math.PI); ctx.translate(-500, -500); ctx.fill(markPath); ctx.restore();
    ctx.restore();
  }
  function text(str, x, y, px, weight, alpha, opts) {
    if (alpha <= 0) return;
    opts = opts || {};
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = opts.color || '#fff';
    ctx.direction = opts.ltr ? 'ltr' : 'rtl';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = weight + ' ' + px + 'px "IBM Plex Sans Arabic", "IBM Plex Sans", sans-serif';
    if (opts.track) ctx.letterSpacing = opts.track + 'px';
    ctx.fillText(str, x, y);
    ctx.restore();
  }
  function rrect(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function chip(label, x, y, px, alpha, dot) {
    if (alpha <= 0) return;
    ctx.save();
    ctx.font = '600 ' + px + 'px "IBM Plex Sans", "IBM Plex Sans Arabic", sans-serif';
    ctx.direction = 'ltr';
    var w = ctx.measureText(label).width + px * (dot ? 2.6 : 1.8), h = px * 2.3;
    ctx.globalAlpha = alpha;
    ctx.translate(x, y); var k = .85 + .15 * alpha; ctx.scale(k, k);
    ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = px * 1.6; ctx.shadowOffsetY = px * .5;
    ctx.fillStyle = '#fff'; rrect(-w / 2, -h / 2, w, h, h / 2); ctx.fill();
    ctx.shadowColor = 'transparent';
    var tx = -w / 2 + px * .9;
    if (dot) { ctx.fillStyle = '#0e9f55'; ctx.beginPath(); ctx.arc(tx + px * .3, 0, px * .32, 0, Math.PI * 2); ctx.fill(); tx += px * .9; }
    ctx.fillStyle = '#000'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(label, tx, 1);
    ctx.restore();
  }
  var v3 = new THREE.Vector3();
  function project(obj, dx, dy) {
    v3.set(dx || 0, dy || 0, 0); obj.localToWorld(v3); v3.project(camera);
    return [(v3.x + 1) / 2 * W, (1 - v3.y) / 2 * H];
  }

  // ---- the timeline --------------------------------------------------------
  function frame(t) {
    var L = layout(), U = Math.min(W, H) / 1080; // type unit
    camera.position.set(0, 0, L.camZ); camera.lookAt(0, 0, 0);

    // Background: black with a soft lifted centre.
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    var g = ctx.createRadialGradient(W / 2, H * .55, 0, W / 2, H * .55, Math.max(W, H) * .7);
    g.addColorStop(0, 'rgba(255,255,255,0.07)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    // Scene 1 (0–3): the mark assembles, the wordmark tracks in.
    var a1 = 1 - seg(t, 2.6, 3.1);
    if (a1 > 0) {
      var fly = eBack(seg(t, 0.1, 1.4));
      var pulse = Math.sin(seg(t, 1.4, 1.75) * Math.PI) * .06;
      var zoom = 1 + eInOut(seg(t, 2.6, 3.1)) * 1.6;
      drawMark(W / 2, H * .45, 260 * U * (1 + pulse) * zoom, .9 * (1 - fly), Math.min(1, seg(t, .1, .5)) * a1, -.5 * (1 - fly));
      var wm = seg(t, 1.5, 2.3);
      text('Nizam · نظام', W / 2, H * .45 + 230 * U, 78 * U, 700, eOut(wm) * a1, { track: (1 - eOut(wm)) * 18, ltr: true });
    }

    // Scene 2 (3–6): kinetic headline.
    var h1 = vis(t, 3.0, 6.0, .45), up1 = eOut(seg(t, 3.0, 3.6)), up2 = eOut(seg(t, 3.25, 3.9));
    text('يوم الشغل كله', W / 2, H * .44 + (1 - up1) * 60 * U, 120 * U, 700, h1 * up1);
    text('في جيب الموظف.', W / 2, H * .44 + 150 * U + (1 - up2) * 60 * U, 120 * U, 700, h1 * up2, { color: '#a8a29e' });

    // Hero phone: in at 5.6, flips at 12, steps back at 17, returns 23, leaves 27.
    var inP = eOut(seg(t, 5.6, 7.2));
    var flip = eInOut(seg(t, 12, 13.2));
    var back = eInOut(seg(t, 16.8, 17.6)), ret = eInOut(seg(t, 22.8, 23.6)), leave = eInOut(seg(t, 26.6, 27.4));
    var heroScale = L.size * (1 - back + ret) * (1 - leave * .35);
    var drift = Math.sin(t * 1.1) * .06;
    var hx = lerp(L.heroX, 0, ret) , hy = lerp(L.heroY, L.heroY, 1) + drift - leave * 1.2;
    if (fmt === 'h' && ret > 0) hx = lerp(L.heroX, L.heroX, ret);
    var ry = lerp(1.25, -.28, inP) + seg(t, 7.2, 12) * .45 + flip * Math.PI * 2 + Math.sin(t * .6) * .04 * ret;
    place(hero, hx, hy, lerp(-14, 0, inP), ry, -.05, t < 5.6 ? 0 : heroScale);
    // Screens: home → check-in (swap when edge-on) → home light/dark/arabic.
    if (t < 12.6) setScreen(hero, 'home-light');
    else if (t < 22.8) setScreen(hero, 'check-in-light');
    else if (t < 24.6) setScreen(hero, 'home-light', 'home-dark', eInOut(seg(t, 23.6, 24.4)));
    else setScreen(hero, 'home-dark', 'home-light-ar', eInOut(seg(t, 25.2, 26.0)));

    // Fan of three phones (17–23).
    var fanIn = [0, 1, 2].map(function (k) { return eBack(seg(t, 17.2 + k * .18, 18.3 + k * .18)); });
    var fanOut = eInOut(seg(t, 22.4, 23.1));
    var names = ['requests-light', 'team-light', 'services-light'];
    var sway = Math.sin((t - 17) * .7) * .12;
    fan.forEach(function (p, k) {
      var side = k - 1;
      var s = L.size * .92 * fanIn[k] * (1 - fanOut);
      place(p, side * L.spread * (1 + fanOut), L.fanY + Math.sin(t * 1.3 + k) * .05, -Math.abs(side) * .6, -side * .38 + sway, -.04, s);
      setScreen(p, names[k]);
    });

    renderer.render(scene, camera);
    ctx.drawImage(glCanvas, 0, 0, W, H);

    // Captions per scene.
    var tx = W * L.textX, ty = H * L.textY;
    var c3 = vis(t, 7.0, 12.0, .5);
    text('حضورك بلمسة', tx, ty, 92 * U, 700, c3);
    text('بموقعك وبصمتك، من موبايلك', tx, ty + 95 * U, 46 * U, 400, c3, { color: '#a8a29e' });
    var hp = project(hero, .55, .55);
    chip('Checked in · 08:55', hp[0], hp[1], 34 * U, eBack(seg(t, 8.4, 9.0)) * (1 - seg(t, 11.6, 12)), true);

    var c4 = vis(t, 13.2, 16.9, .5);
    text('نطاق الفرع · QR · بصمة', tx, ty, 80 * U, 700, c4);
    text('ومن غير نت كمان', tx, ty + 90 * U, 46 * U, 400, c4, { color: '#a8a29e' });
    if (t > 13.3 && t < 16.8) {
      var c = project(hero, 0, 0);
      for (var r = 0; r < 3; r++) {
        var ph = ((t - 13.3) * .8 + r / 3) % 1;
        ctx.save(); ctx.globalAlpha = (1 - ph) * .5 * c4; ctx.strokeStyle = '#fff'; ctx.lineWidth = 4 * U;
        ctx.beginPath(); ctx.arc(c[0], c[1], (120 + ph * 520) * U * L.size, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
      }
      chip('Inside work zone · 28 m', c[0], c[1] + 560 * U * L.size, 30 * U, eBack(seg(t, 14.0, 14.6)) * (1 - seg(t, 16.4, 16.8)), true);
    }

    var c5 = vis(t, 18.2, 22.6, .5);
    text('إجازات · موافقات · رواتب', W / 2, H * (fmt === 'h' ? .12 : L.textY), 80 * U, 700, c5);
    text('كل خدمات الـ HR في تطبيق واحد', W / 2, H * (fmt === 'h' ? .12 : L.textY) + 90 * U, 46 * U, 400, c5, { color: '#a8a29e' });
    chip('Leave approved ✓', W * (fmt === 'h' ? .78 : .73), H * (fmt === 'h' ? .78 : .74), 32 * U, eBack(seg(t, 19.4, 20.0)) * (1 - seg(t, 22.2, 22.6)), true);

    var c6a = vis(t, 23.6, 25.2, .4), c6b = vis(t, 25.2, 26.8, .4);
    text('وضع داكن مريح للعين', tx, ty, 84 * U, 700, c6a);
    text('عربي وإنجليزي', tx, ty, 92 * U, 700, c6b);

    // End card (27–30).
    var e = seg(t, 27.1, 27.9);
    if (e > 0) {
      var fly2 = eBack(seg(t, 27.1, 28.2));
      drawMark(W / 2, H * .36, 200 * U, .7 * (1 - fly2), eOut(e), 0);
      text('Nizam · نظام', W / 2, H * .36 + 190 * U, 80 * U, 700, eOut(seg(t, 27.6, 28.3)), { ltr: true });
      text('اطلب عرض تجريبي لشركتك', W / 2, H * .36 + 300 * U, 50 * U, 600, eOut(seg(t, 27.9, 28.6)));
      chip('WhatsApp  01144189560', W / 2, H * .36 + 420 * U, 38 * U, eBack(seg(t, 28.2, 28.9)), true);
      text('pauloup90.github.io/nizam-site', W / 2, H * .36 + 530 * U, 34 * U, 500, eOut(seg(t, 28.5, 29.2)), { ltr: true, color: '#a8a29e' });
    }
  }

  // ---- sizing & playback ---------------------------------------------------
  function resize() {
    W = FORMATS[fmt][0]; H = FORMATS[fmt][1];
    out.width = W; out.height = H;
    renderer.setSize(W, H, false);
    camera.aspect = W / H; camera.updateProjectionMatrix();
  }
  var start = 0, playing = false, recorder = null;
  var prog = document.getElementById('prog');
  function loop(now) {
    if (!playing) return;
    var t = (now - start) / 1000;
    if (t >= T) { t = T; playing = false; if (recorder) recorder.stop(); }
    frame(t);
    prog.style.width = (t / T * 100) + '%';
    if (playing) requestAnimationFrame(loop);
  }
  function play() { start = performance.now(); playing = true; requestAnimationFrame(loop); }

  document.querySelectorAll('[data-f]').forEach(function (b) {
    b.addEventListener('click', function () {
      if (recorder) return;
      fmt = b.getAttribute('data-f');
      document.querySelectorAll('[data-f]').forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
      resize(); play();
    });
  });
  document.getElementById('play').addEventListener('click', function () { if (!recorder) play(); });

  var note = document.getElementById('note');
  document.getElementById('rec').addEventListener('click', function () {
    if (recorder || !out.captureStream || !window.MediaRecorder) { note.textContent = 'المتصفح ده مش بيدعم التسجيل. جرّب Chrome على الكمبيوتر.'; return; }
    var types = ['video/mp4;codecs=avc1.640028', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
    var type = types.filter(function (x) { return MediaRecorder.isTypeSupported(x); })[0];
    var chunks = [];
    recorder = new MediaRecorder(out.captureStream(60), { mimeType: type, videoBitsPerSecond: 14e6 });
    recorder.ondataavailable = function (e) { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = function () {
      var ext = type.indexOf('mp4') >= 0 ? 'mp4' : 'webm';
      var blob = new Blob(chunks, { type: type.split(';')[0] });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'nizam-ad-' + { v: '9x16', h: '16x9', s: '1x1' }[fmt] + '.' + ext;
      document.body.appendChild(a); a.click(); a.remove();
      recorder = null;
      document.getElementById('rec').disabled = false;
      note.textContent = 'اتحفظ الفيديو (' + ext.toUpperCase() + '). خلّي التاب مفتوح وظاهر وقت التسجيل عشان يطلع ناعم.';
    };
    document.getElementById('rec').disabled = true;
    note.textContent = 'بيسجّل... سيب التاب ده مفتوح وظاهر لحد ما يخلص (30 ثانية).';
    recorder.start(250);
    play();
  });

  // ?t=12.5 renders one still frame (for checking a moment); ?f=h picks the format.
  var q = new URLSearchParams(location.search);
  if (q.get('f') && FORMATS[q.get('f')]) fmt = q.get('f');
  document.querySelectorAll('[data-f]').forEach(function (x) { x.setAttribute('aria-pressed', x.getAttribute('data-f') === fmt); });
  resize();
  var names = ['home-light', 'home-dark', 'home-light-ar', 'check-in-light', 'requests-light', 'team-light', 'services-light'];
  Promise.all(names.map(load).concat([
    document.fonts.load('700 80px "IBM Plex Sans Arabic"'), document.fonts.load('400 40px "IBM Plex Sans Arabic"'),
    document.fonts.load('600 40px "IBM Plex Sans"'), document.fonts.load('700 40px "IBM Plex Sans"')
  ])).then(function () {
    if (q.get('t')) { frame(parseFloat(q.get('t'))); document.title = 'ready'; }
    else play();
  });
})();
</script>
</body>
</html>
